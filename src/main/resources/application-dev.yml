# =============================================================================
# application-dev.yml — DEVELOPMENT profile
#
# Activated with: --spring.profiles.active=dev
# Or in application.yml: spring.profiles.active: dev
#
# This profile overrides the values in application.yml for local development.
# The values here are in plain text because this file should NEVER be committed
# with real credentials → see .gitignore
# =============================================================================

spring:
  jpa:
    # In dev: recreates the schema on each restart if needed
    # Change to "update" to keep data between restarts
    hibernate:
      ddl-auto: update
    # Displays and formats generated SQL → useful for debugging queries
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # DevTools — automatic reload on every compiled class change
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# More verbose logging in development
logging:
  level:
    com.template.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE